name: CI / CD Security & Quality Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  security-and-build:
    name: Build, Audit & Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Secret Scan (Gitleaks / Keyword Guard)
        run: |
          echo "Verifying no hardcoded secrets or passwords in source..."
          ! grep -rnE "(ADMIN_PASSWORD=['\"][a-zA-Z0-9_-]{3,}['\"]|passcode=['\"]Mogul['\"]|sk_live_|AIzaSy[A-Za-z0-9_-]{33})" src/ api/ app/ || { echo "ERROR: Hardcoded secret pattern found!"; exit 1; }

      - name: Typecheck TypeScript
        run: npx tsc --noEmit

      - name: Security Vulnerability Audit
        run: npm audit --audit-level=critical || true

      - name: Production Build
        run: npm run build
        env:
          NODE_ENV: production
